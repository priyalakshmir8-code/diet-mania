<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7f3" />
    <title>Rooted — Dietician workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#" data-route="dashboard" aria-label="Rooted home">
          <span class="brand-mark"><span></span><span></span><span></span></span>
          <span class="brand-name">rooted<span class="brand-dot">.</span><small>DIETICIAN STUDIO</small></span>
        </a>
        <div class="workspace-label">WORKSPACE</div>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-link active" data-route="dashboard"><span class="nav-icon">⌂</span>Overview</button>
          <button class="nav-link" data-route="clients"><span class="nav-icon">♧</span>Clients <span class="nav-count" id="clientNavCount">0</span></button>
          <button class="nav-link" data-route="schedule"><span class="nav-icon">▦</span>Consultations</button>
        </nav>
        <div class="sidebar-divider"></div>
        <div class="workspace-label">YOUR PRACTICE</div>
        <button class="nav-link" data-route="settings"><span class="nav-icon">⚙</span>Settings</button>
        <div class="sidebar-bottom">
          <div class="support-card">
            <div class="support-icon">✳</div>
            <strong>A little more support?</strong>
            <p>Your clients' care, all in one calm place.</p>
            <button type="button" class="text-button" data-route="clients">Explore your clients <span>↗</span></button>
          </div>
          <div class="profile-mini">
            <div class="avatar avatar-plum">PS</div>
            <div><strong>Priya Shah</strong><small>Dietician</small></div>
            <button class="more-button" aria-label="Profile menu">···</button>
          </div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
          <div class="breadcrumb"><span>Workspace</span><b>/</b><strong id="pageCrumb">Overview</strong></div>
          <div class="topbar-actions">
            <div class="today-label"><span class="online-dot"></span><span id="todayDate"></span></div>
            <button class="icon-button notification-button" aria-label="Notifications">♧<i></i></button>
            <div class="avatar avatar-plum top-avatar">PS</div>
          </div>
        </header>
        <section id="appView" class="page-content" aria-live="polite"></section>
        <footer class="privacy-note"><span>⌑</span> Client data stays in this browser on this device. This prototype does not send emails or sync data.</footer>
      </main>
    </div>
    <div id="modalRoot"></div>
    <div id="toastRoot" class="toast-root" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
